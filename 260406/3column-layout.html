<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3단 레이아웃</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
       #wrapper{
        width:1200px;
        /*border: 1px solid gray;*/
       }
       #header{
        width: 100%;
        height: 120px;
        background: #ccc;
       }
       #sidebar-left{
        width: 250px;
        height: 600px;
        background: #aaa;
        float: left;
       }
        #contents{
        width: 800px;
        height: 600px;
        background: #646464;
        float: left;
       }
        #sidebar-right{
        width: 150px;
        height: 600px;
        background: #c2bbbb;
        float: left;
       }
        #footer{
        width: 100%;
        height: 100px;
        background: #ddd8d8;
        clear: both;
       }

    </style>
</head>
<body>
    <div id="wrapper">
        <div id="header">헤더(#header)</div>
        <div id="sidebar-left">사이드바(#sidebar-left)</div>
        <div id="contents">본문(#contents)</div>
        <div id="sidebar-right">사이드바(#sidebar-right)</div>
        <div id="footer">푸터(#footer)</div>

    </div>
</body>
</html>
